name: Generate Stock Report and Deploy v2
on:
  schedule:
    # Run Mon-Fri at 20:00 UTC (01:00 next day in cron due to UTC offset)
    - cron: "00 20 * * 1-5"
  workflow_dispatch:

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'  # Upgrade to a more recent, supported version
          cache: 'pip'  # Cache pip dependencies for faster runs

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install holidays yfinance pandas numpy matplotlib ipython==7.16.1 torch lxml torchsummary scikit-learn

      - name: Run main analysis script
        run: python ${{ github.workspace }}/Market_Analysis_App/main.py

      - name: Generate S&P 500 heatmap
        run: python ${{ github.workspace }}/Market_Analysis_App/gen_snp500_heatmap.py

      - name: Move generated files to docs
        run: |
          mv -f ${{ github.workspace }}/index.html ${{ github.workspace }}/docs/index.html
          mv -f ${{ github.workspace }}/snp500_top100_treemap.png ${{ github.workspace }}/docs/snp500_top100_treemap.png
        continue-on-error: true  # Continue even if files are missing

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.email "windycc@users.noreply.github.com"
          git config user.name "windycc"
          git add docs/
          git commit -m "Deploy updated stock report to GitHub Pages" || echo "No changes to commit"
          git push origin ${{ github.ref_name }}

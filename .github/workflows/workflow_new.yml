# ------------- Enhanced Plot -------------
import seaborn as sns
sns.set_theme(style='whitegrid', palette='colorblind')

fig, ax = plt.subplots(figsize=(12, 6))
sns.despine(ax=ax, left=True, right=True, top=True)

# Histogram
sns.histplot(
    mc_prices,
    bins=60,
    kde=True,
    stat='density',
    color='#4c72b0',
    edgecolor='white',
    linewidth=0.5,
    alpha=0.25,
    ax=ax,
    label='Monte-Carlo'
)

# Vertical lines for predictions
ax.axvline(
    lr_pred,
    color='#c44e52',
    ls='--',
    lw=2.5,
    label=f'Linear Regression  ${lr_pred:.2f}'
)
ax.axvline(
    lstm_pred,
    color='#55a868',
    ls='--',
    lw=2.5,
    label=f'LSTM               ${lstm_pred:.2f}'
)

# Shaded price-level bands
for i, (low, high) in enumerate(price_levels):
    ax.axvspan(
        low,
        high,
        ymin=0,
        ymax=0.15,
        color='#ffd166',
        alpha=0.4,
        label='Price Band' if i == 0 else None
    )

# Annotations
ax.text(
    0.02,
    0.97,
    f'{ticker} – simulated close price on {target_date}',
    transform=ax.transAxes,
    ha='left',
    va='top',
    fontsize=13,
    weight='bold',
    color='black'
)
ax.text(
    0.02,
    0.92,
    f'Last Close: ${latest_price:.2f}',
    transform=ax.transAxes,
    ha='left',
    va='top',
    fontsize=11,
    color='dimgray'
)

ax.set_xlabel('Price ($)', fontsize=12, labelpad=10)
ax.set_ylabel('Density', fontsize=12, labelpad=10)
ax.legend(loc='upper right', frameon=False, fontsize=10)
ax.grid(alpha=0.25, lw=0.5)

plt.tight_layout()
plt.savefig(f'{ticker.lower()}_price_distribution.png', dpi=300, bbox_inches='tight')
plt.show()

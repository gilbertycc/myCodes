name: Generate Stock Report and Deploy

on:
  schedule:
    - cron: "00 01 * * 1-5"          # Mon-Fri 01:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11          # <-- no quotes

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
            pip install yfinance holidays pandas numpy matplotlib ipython>=8.0 torch lxml torchsummary scikit-learn retrying
      
      - name: Run main.py (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: python ${{ github.workspace }}/Market_Analysis_App/main.py

      - name: Run gen_snp500_heatmap.py (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: python ${{ github.workspace }}/Market_Analysis_App/gen_snp500_heatmap.py

      - name: Move artefacts to docs
        run: |
          mkdir -p ${{ github.workspace }}/docs
          mv -f ${{ github.workspace }}/Market_Analysis_App/index.html \
                ${{ github.workspace }}/docs/index.html || echo "index.html not found"
          mv -f ${{ github.workspace }}/Market_Analysis_App/snp500_top100_treemap.png \
                ${{ github.workspace }}/docs/snp500_top100_treemap.png || echo "snp500_top100_treemap.png not found"

      - name: Commit & push changes
        run: |
          git config --local user.email "windycc@users.noreply.github.com"
          git config --local user.name "windycc"
          git add docs/
          git diff --staged --quiet || git commit -m "Deploy Stock Report to GitHub Pages"
          git push origin main

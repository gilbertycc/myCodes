name: Generate Stock Report and Deploy

on:
  schedule:
    - cron: "00 01 * * 1-5" # Runs Mon-Fri at 01:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8' # Consider upgrading to '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance holidays pandas numpy matplotlib ipython>=8.0 torch lxml torchsummary scikit-learn

      - name: List files
        run: ls -R ${{ github.workspace }}/Market_Analysis_App

      - name: Verify dependencies
        run: pip list

      - name: Run main.py
        run: python ${{ github.workspace }}/Market_Analysis_App/main.py > main.log 2>&1

      - name: Display main.py log
        if: failure()
        run: cat main.log

      - name: Run gen_snp500_heatmap.py
        run: python ${{ github.workflow }}/Market_Analysis_App/gen_snp500_heatmap.py > heatmap.log 2>&1

      - name: Display gen_snp500_heatmap.py log
        if: failure()
        run: cat heatmap.log

      - name: Move report to docs
        run: |
          mv -f ${{ github.workspace }}/index.html ${{ github.workspace }}/docs/index.html || echo "index.html not found"
          mv -f ${{ github.workspace }}/snp500_top100_treemap.png ${{ github.workspace }}/docs/snp500_top100_treemap.png || echo "snp500_top100_treemap.png not found"

      - name: Commit changes
        run: |
          git config --local user.email "windycc@users.noreply.github.com"
          git config --local user.name "windycc"
          git add docs/
          git diff --staged --quiet || git commit -m "Deploy Stock Report to GitHub Pages"

      - name: Push changes
        uses: ad-m/github-push-action@v0.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main # Adjust if using a different branch
